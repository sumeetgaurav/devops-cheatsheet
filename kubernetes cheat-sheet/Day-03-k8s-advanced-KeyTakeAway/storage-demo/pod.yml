apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: ngnix-ns
spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
    volumeMounts:
    - name: data
      mountPath: /usr/share/nginx/html

  volumes:
    - name: data
      persistentVolumeClaim:
          claimName: storage-demo-pvc
